name: Deploy web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/entre-safras-mobile/package-lock.json
      - name: Install dependencies
        working-directory: apps/entre-safras-mobile
        run: npm ci
      - name: Verify and build
        working-directory: apps/entre-safras-mobile
        run: npm run lint && npm run typecheck && npm test -- --run && npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/entre-safras-mobile/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
